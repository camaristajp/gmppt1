[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmppt"
version = "0.1.0"
description = "Conditional peak-voltage coefficient for model-based global MPPT in module-level solar optimizers (Phase 1)."
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "numpy==2.4.4",
    "scipy==1.17.1",
    "pandas==3.0.2",
    "pvlib==0.15.2",
    "pyarrow==25.0.0",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]
# Leg 1 of S4 (Basoglu parameter fit) needs PySAM. Optional: S4 passes on leg 2
# (Sandia cross-check) without it.
validation = [
    "nrel-pysam",
]

[tool.setuptools.packages.find]
include = ["gmppt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
