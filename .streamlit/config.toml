# GMPPT Bench — Streamlit theme. Put this folder next to gmppt_app.py.
# Widget accents (sliders, toggles, selected pills, multiselect chips) come from here;
# everything else is styled by gmppt_ui.setup().

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

# Dark is the dashboard's default (gmppt_ui.DARK tokens); the header's Light
# switch restyles the page through gmppt_ui.setup(), while widget accents stay
# on these values because Streamlit reads them once, at start.
[theme]
base = "dark"
primaryColor = "#2FA3AE"
backgroundColor = "#0F1A22"
secondaryBackgroundColor = "#223544"
textColor = "#F2F4F5"
borderColor = "#27404F"
showWidgetBorder = true
baseRadius = "0.6rem"
linkColor = "#2FA3AE"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
chartCategoricalColors = ["#16616B", "#A32B24", "#7FA5A8", "#9BBDBF", "#8A9098", "#B5641A"]